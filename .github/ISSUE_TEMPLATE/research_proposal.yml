name: Research proposal
description: Propose a change that needs agreement before code (an RFC), or a new study built on this code.
title: "[Proposal] "
labels: ["research-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        A proposal is required before changing simulator semantics, the reward definition,
        metric definitions, the workload generator or load profiles, the guardrail rules, or a
        public interface such as SchedulerPlugin. See CONTRIBUTING.md.

        Typical proposers: an HPC or cluster scheduling researcher adding a trace-driven
        workload, a reinforcement-learning researcher changing the discount or the reward, a
        systems reliability researcher redesigning the guardrails, or a platform engineer
        proposing a change to the plugin interface.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Simulator semantics
        - Reward definition
        - Metric definitions
        - Workload generator or load profiles
        - Guardrail rules
        - Public interface (SchedulerPlugin, config schema, CSV columns)
        - New method or study, no change to existing semantics
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Research question
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What you expect to find, stated so that it can turn out false.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Experimental design
      description: Methods compared, baselines, metrics, seeds (at least 5 reporting seeds; tuning on seeds 100 and above), and what changes in the code and configs.
    validations:
      required: true
  - type: textarea
    id: falsification
    attributes:
      label: Evidence that would change the conclusion
      description: What result would make you reject the hypothesis or the proposed change.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Effect on existing results
      description: Which existing [Reproduced] numbers would become stale and need a new reference run, and which interfaces would break.
    validations:
      required: true
  - type: textarea
    id: data_sources
    attributes:
      label: Data sources
      description: Every trace or workload source, its licence, where it is downloaded from, and how it is checksummed. Write "built-in synthetic generator" if no external data is used.
    validations:
      required: true
  - type: checkboxes
    id: data_confirmation
    attributes:
      label: Data confirmation
      options:
        - label: The proposal uses no real medical, financial or personal data; any public trace is downloaded by script into a git-ignored folder, and only generators, download scripts, checksums and tiny synthetic fixtures would be committed.
          required: true
  - type: textarea
    id: compute
    attributes:
      label: Compute needs
      description: CPU or GPU, expected wall-clock time per seed, and whether a smoke variant can stay under 30 seconds on a laptop CPU.
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Will you implement it?
      options:
        - Yes, I will open the pull request
        - I can help, but need a co-implementer
        - No, I am proposing it for others
    validations:
      required: true
